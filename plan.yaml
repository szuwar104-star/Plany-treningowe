# Plan biegowy 10 km, 26.10 - 20.12 (8 tygodni)
# Zmiana tego pliku na GitHubie (main) = automatyczna synchronizacja z Garmin Connect.
#
# Tempa i czasy ZAWSZE w cudzysłowie: "4:11", "2:00".
#
# Szablony (szablon: ...):
#   spokojny       km_txt, km, [opcja], [przebiezki: true], [sila: false]
#   dlugi          km_txt, km, [opcja], [uwaga]
#   opcja_rozruch  (tylko data) – wolne lub 5-6 km
#   akcent         nazwa, cel, powtorzenia, metry, tempo: ["od", "do"],
#                  przerwa: {min/sek/m}, przerwa_txt, stop: PROG | VO2 | "własny tekst",
#                  [stop_dodatek], [uwaga], [dodatkowe]  (dodatkowe = opcjonalne powtórzenie)
# Bez szablonu:    nazwa, opis, [dopisz_stop: true], kroki:
#                  - test_5km / start_10km (gotowe zestawy), albo lista kroków:
#                      - rozgrzewka: {km: 3, notatka: "..."}     # bez wartości = do Lap
#                      - powtorz: 5
#                        kroki:
#                          - bieg: {m: 1000, tempo: ["4:50", "5:10"], luz: 2}
#                          - odpoczynek: {min: 2}
#                      - schladzanie:
#                    gotowe kroki: przebiezki, rozgrzewka_std, schlodzenie_std
#                    czas kroku: km / m / min / sek / lap: true; cel: tempo albo strefa_hr
# Trening siłowy: zestaw raz w sekcji zestawy_sily, w treningi tylko {data, sila: A}.
#   Ten sam dzień może mieć bieg i siłę (dwa treningi w kalendarzu).
#   Kroki siłowe: cwiczenie: {co: plank, sek: 45} albo {co: pompki, powt: 12}
#                 przerwa: {sek: 60}; powtorz: 3 + kroki – obwody.
#   Skróty co: pompki, pompki_na_kolanach, przysiad, przysiad_jednonoz,
#     przysiad_bulgarski, wykroki, wykroki_wstecz, wykroki_boczne, plank,
#     plank_boczny, plank_boczny_noga, copenhagen, przywodziciele, mostek,
#     mostek_jednonoz, mostek_marsz, martwy_jednonoz, dead_bug, bird_dog, brzuszki,
#     rowerek, unoszenie_nog, hollow, superman, wspiecia, wspiecia_jednonoz,
#     muszelka, wymachy_bok, mountain_climber, burpee, podciaganie, dipy,
#     wejscia_na_podwyzszenie
#   Inne ćwiczenia: nazwa z katalogu Garmina (python garmin_trening.py --cwiczenia SZUKAJ),
#     np. cwiczenie: {kategoria: PLANK, nazwa: SIDE_PLANK, sek: 30}
# Każda pozycja może mieć opcjonalny: true (pomijane z --bez-opcjonalnych).
#
# Zmiana nazwy/opisu = trening w Garminie zostanie wymieniony. Pozycje usunięte
# z pliku znikają z kalendarza (w zakresie dat planu).

stare_nazwy:  # usuwane z "Moje treningi" przed wgraniem planu (stary plan + poprzednia wersja tego planu)
  - "Próg 4x1600"
  - "Spokojny 9 km"
  - "Interwały 5x1000"
  - "Interwały 6x800"
  - "Spokojny 8 km"
  - "Próg 3x2000"
  - "Siła A: przywodziciele i core"
  - "Siła B: jednonóż i pośladki"
  - "Siła A2: przywodziciele i core+"
  - "Siła B2: jednonóż i pośladki+"
  - "Siła L: lekko"
  - "Core + góra 10 min"
  - "Spokojny 7 km"
  - "T1 Próg 3x2000"
  - "T1 VO2 5-6x1000"
  - "T2 Próg 2x3000"
  - "T2 VO2 5x1200"
  - "T3 Próg 4x2000"
  - "T3 Szybkość 8x400"
  - "Spokojny 6 km"
  - "T4 Próg 4x1000 lekko"
  - "T4 TEST 5 km"
  - "T5 Próg 2x4000"
  - "T5 VO2 5x1000"
  - "T6 Próg 3x3000"
  - "T6 Tempo 5 km 4x1600"
  - "T7 Tempo startowe 3x2000"
  - "T7 VO2 5x1000"
  - "T8 Wyostrzenie 4x1000"
  - "Rozruch 4-5 km + przebieżki"
  - "Opcja: wolne lub trucht 2-3 km"
  - "START 10 km"

zestawy_sily:
  # Tygodnie 1-3: A (pon) i B (czw). Tydzień 4 i 8: L (lekki). Tygodnie 5-7: A2 i B2 (trudniej).
  # C: krótki core + góra ciała w sobotę, opcjonalnie.
  A:
    nazwa: "Siła A: przywodziciele i core"
    opis: >-
      15-20 min po spokojnym biegu. 3 obwody, przerwa 60 s. Ruch kontrolowany,
      bez bólu pachwiny. Copenhagen w wersji łatwej (kolano na ławce).
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg przód-tył i w bok"}
      - powtorz: 3
        kroki:
          - cwiczenie: {co: copenhagen, sek: 20, notatka: "Copenhagen, na każdą stronę. Kolano na ławce"}
          - cwiczenie: {co: mostek_jednonoz, powt: 10, notatka: "Na każdą nogę, 2 s w górze"}
          - cwiczenie: {co: plank_boczny, sek: 30, notatka: "Na każdą stronę, biodra wysoko"}
          - cwiczenie: {co: dead_bug, powt: 10, notatka: "Na stronę, lędźwie przy podłodze"}
          - przerwa: {sek: 60}
  B:
    nazwa: "Siła B: jednonóż i pośladki"
    opis: >-
      15-20 min po spokojnym biegu. 2 obwody, przerwa 60 s. Wolne tempo,
      kolano nad stopą, bez bólu pachwiny i biodra.
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg, 10 przysiadów"}
      - powtorz: 2
        kroki:
          - cwiczenie: {co: przysiad_bulgarski, powt: 8, notatka: "Bez hantli. Na każdą nogę, tylna stopa na krześle"}
          - cwiczenie: {co: martwy_jednonoz, powt: 8, notatka: "Bez obciążenia. Na każdą nogę, plecy proste"}
          - cwiczenie: {co: wspiecia_jednonoz, powt: 12, notatka: "Na każdą nogę, 3 s w dół"}
          - cwiczenie: {co: copenhagen, sek: 20, notatka: "Copenhagen, na każdą stronę. Kolano na ławce"}
          - cwiczenie: {co: plank, sek: 45, notatka: "Albo na przedramionach"}
          - przerwa: {sek: 60}
  A2:
    nazwa: "Siła A2: przywodziciele i core+"
    opis: >-
      Wersja trudniejsza A (tygodnie 5-7). 3 obwody, przerwa 60 s. Copenhagen
      pełny (stopa na ławce) tylko jeśli łatwa wersja była bez dyskomfortu.
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg przód-tył i w bok"}
      - powtorz: 3
        kroki:
          - cwiczenie: {co: copenhagen, sek: 25, notatka: "Copenhagen, na każdą stronę. Stopa na ławce albo kolano, jeśli pachwina czuje"}
          - cwiczenie: {co: mostek_jednonoz, powt: 12, notatka: "Na każdą nogę, 3 s w górze"}
          - cwiczenie: {co: plank_boczny_noga, sek: 35, notatka: "Na każdą stronę"}
          - cwiczenie: {co: dead_bug, powt: 12, notatka: "Na stronę, wolno, wydech przy wyproście"}
          - cwiczenie: {co: muszelka, powt: 15, notatka: "Na każdą stronę"}
          - przerwa: {sek: 60}
  B2:
    nazwa: "Siła B2: jednonóż i pośladki+"
    opis: >-
      Wersja trudniejsza B (tygodnie 5-7). 2-3 obwody (trzeci tylko przy
      świeżych nogach), przerwa 60 s. Bez bólu pachwiny i biodra.
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg, 10 przysiadów"}
      - powtorz: 2
        kroki:
          - cwiczenie: {co: przysiad_bulgarski, powt: 10, notatka: "Bez hantli. Na każdą nogę, 3 s w dół"}
          - cwiczenie: {co: martwy_jednonoz, powt: 10, notatka: "Bez obciążenia. Na każdą nogę, plecy proste"}
          - cwiczenie: {co: wykroki_boczne, powt: 8, notatka: "Na każdą stronę, płytko, bez bólu pachwiny"}
          - cwiczenie: {co: wspiecia_jednonoz, powt: 15, notatka: "Na każdą nogę, 3 s w dół"}
          - cwiczenie: {co: copenhagen, sek: 25, notatka: "Copenhagen, na każdą stronę"}
          - cwiczenie: {co: plank, sek: 60, notatka: "Albo na przedramionach"}
          - przerwa: {sek: 60}
      - cwiczenie: {co: plank, lap: true, notatka: "OPCJONALNIE 3. obwód przy świeżych nogach. Inaczej zakończ trening"}
  L:
    nazwa: "Siła L: lekko"
    opis: >-
      Tydzień odciążenia i przedstartowy. 2 obwody, przerwa 45 s. Ma być
      łatwo - podtrzymanie, nie trening.
    kroki:
      - rozgrzewka: {min: 2, notatka: "Krążenia bioder, wymachy nóg"}
      - powtorz: 2
        kroki:
          - cwiczenie: {co: copenhagen, sek: 15, notatka: "Copenhagen, na każdą stronę. Kolano na ławce"}
          - cwiczenie: {co: mostek, powt: 12, notatka: "Obunóż, 2 s w górze"}
          - cwiczenie: {co: plank_boczny, sek: 20, notatka: "Na każdą stronę"}
          - cwiczenie: {co: dead_bug, powt: 8, notatka: "Na stronę"}
          - przerwa: {sek: 45}
  C:
    nazwa: "Core + góra 10 min"
    opis: >-
      Opcjonalnie, w dzień wolny albo po rozruchu. 2 obwody bez przerw między
      ćwiczeniami, 45 s po obwodzie. Pomiń przy zmęczeniu przed długim biegiem.
    kroki:
      - powtorz: 2
        kroki:
          - cwiczenie: {co: plank, sek: 40, notatka: "Albo na przedramionach"}
          - cwiczenie: {co: pompki, powt: 10, notatka: "Na kolanach, jeśli technika się psuje"}
          - cwiczenie: {co: bird_dog, powt: 10, notatka: "Na stronę, 2 s w wyproście"}
          - cwiczenie: {co: plank_boczny, sek: 25, notatka: "Na każdą stronę"}
          - cwiczenie: {co: superman, powt: 12}
          - cwiczenie: {co: hollow, sek: 20, notatka: "Hollow hold. Łatwiej: kolana ugięte"}
          - przerwa: {sek: 45}

