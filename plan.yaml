      sub-40 na wiosnę. Przy wietrze/lodzie, złym samopoczuciu lub niskim HRV
      przełóż o dzień.
    dopisz_stop: true
    kroki: test_5km
  - {data: 2026-11-21, szablon: opcja_rozruch}
  - {data: 2026-11-21, sila: C, opcjonalny: true}
  - {data: 2026-11-22, szablon: dlugi, km_txt: "14-16", km: 14, opcja: 2, uwaga: Tydzień odciążenia - spokojnie.}

