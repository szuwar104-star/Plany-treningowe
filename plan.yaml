# Plan biegowy: blok 1 (10 km, 26.10 - 20.12) + blok 2 (baza zimowa i próg, 21.12 - 14.02)
# Aktualizacja 26.10: tempa progowe T3-T6 skorygowane po 4x1600 z 20.10, T4 łagodniejszy,
# długi 1.11 bez przyspieszeń, we wtorek 27.10 kontrola HR pod LTHR 167.
# Aktualizacja 28.10: długie 8.11 i 15.11 skrócone z 20 do 18 km.
# Zmiana tego pliku na GitHubie (main) = automatyczna synchronizacja z Garmin Connect.
#
# Tempa i czasy ZAWSZE w cudzysłowie: "4:11", "2:00".
#
# Szablony (szablon: ...):
#   spokojny       km_txt, km, [opcja], [przebiezki: true],
#                  [sila: false] = wersja przedstartowa: nazwa z dopiskiem "(przedstartowy)"
#   dlugi          km_txt, km, [opcja], [uwaga]
#   opcja_rozruch  (tylko data) – wolne lub 5-6 km
#   akcent         nazwa, cel, powtorzenia, metry, tempo: ["od", "do"],
#                  przerwa: {min/sek/m}, przerwa_txt, stop: PROG | VO2 | "własny tekst",
#                  [stop_dodatek], [uwaga], [dodatkowe]  (dodatkowe = opcjonalne powtórzenie)
# Bez szablonu:    nazwa, opis, [dopisz_stop: true], kroki:
#                  - test_5km / start_10km (gotowe zestawy), albo lista kroków:
#                      - rozgrzewka: {km: 3, notatka: "..."}     # bez wartości = do Lap
#                      - powtorz: 5
#                        kroki:
#                          - bieg: {m: 1000, tempo: ["4:50", "5:10"], luz: 2}
#                          - odpoczynek: {min: 2}
#                      - schladzanie:
#                    gotowe kroki: przebiezki, rozgrzewka_std, schlodzenie_std
#                    czas kroku: km / m / min / sek / lap: true; cel: tempo albo strefa_hr
# Trening siłowy: zestaw raz w sekcji zestawy_sily, w treningi tylko {data, sila: A}.
#   Ten sam dzień może mieć bieg i siłę (dwa treningi w kalendarzu).
#   Kroki siłowe: cwiczenie: {co: plank, sek: 45} albo {co: pompki, powt: 12}
#                 przerwa: {sek: 60}; powtorz: 3 + kroki – obwody.
#   Ćwiczenia jednostronne podajesz RAZ, sek/powt na JEDNĄ stronę. Skrypt sam
#     robi dwa kroki: lewa i prawa. Jednostronne: przysiad_jednonoz,
#     przysiad_bulgarski, mostek_jednonoz, martwy_jednonoz, wspiecia_jednonoz,
#     wejscia_na_podwyzszenie, plank_boczny, plank_boczny_noga, copenhagen,
#     przywodziciele, muszelka, wymachy_bok, wykroki_boczne.
#     Przy krokach na czas między stronami jest 5 s "Zmień stronę"
#     (zmiana: 10 = inna długość, zmiana: 0 = bez przerwy).
#     strony: noga / strona / reka / true – podział innego ćwiczenia (to samo
#     robi notatka "na każdą stronę/nogę"); strony: false – bez podziału.
#     Naprzemienne (dead_bug, bird_dog, mostek_marsz) nie są dzielone –
#     w notatce napisz, czy powt to suma, czy liczba na stronę.
#   Przed każdym ćwiczeniem na czas, przed którym nie ma przerwy (także
#     pierwszym w obwodzie), skrypt wstawia 10 s "Przygotuj: ...". W zestawie
#     lub ćwiczeniu: przejscie: 15, przejscie: lap (start po Lapie), przejscie: 0.
#   Nie dopisuj ręcznie kroków lewa/prawa ani przerw na zmianę i przejście.
#   Pozostałe skróty co: pompki, pompki_na_kolanach, przysiad, wykroki,
#     wykroki_wstecz, plank, mostek, brzuszki, rowerek, unoszenie_nog, hollow,
#     superman, wspiecia, mountain_climber, burpee, podciaganie, dipy
#   Inne ćwiczenia: nazwa z katalogu Garmina (python garmin_trening.py --cwiczenia SZUKAJ),
#     np. cwiczenie: {kategoria: PLANK, nazwa: SIDE_PLANK, sek: 30}
# Każda pozycja może mieć opcjonalny: true (pomijane z --bez-opcjonalnych).
#
# Zmiana nazwy/opisu = trening w Garminie zostanie wymieniony. Pozycje usunięte
# z pliku znikają z kalendarza (w zakresie dat planu).

stare_nazwy:  # usuwane z "Moje treningi" (stary plan 20-30.10)
  - Próg 4x1600
  - Spokojny 9 km
  - Interwały 5x1000
  - Interwały 6x800
  - Próg 3x2000

zestawy_sily:
  # Tygodnie 1-3: A (pon) i B (czw). Tydzień 4 i 8: L (lekki). Tygodnie 5-7: A2 i B2 (trudniej).
  # C: krótki core + góra ciała w sobotę, opcjonalnie.
  # Blok 2: A3 i B3 (cięższe, B3 z hantlami), tygodnie odciążenia: L.
  # sek/powt w ćwiczeniach jednostronnych = na jedną stronę.
  A:
    nazwa: "Siła A: przywodziciele i core"
    opis: >-
      15-20 min po spokojnym biegu. 3 obwody, przerwa 60 s. Ruch kontrolowany,
      bez bólu pachwiny. Copenhagen w wersji łatwej (kolano na ławce).
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg przód-tył i w bok"}
      - powtorz: 3
        kroki:
          - cwiczenie: {co: copenhagen, sek: 20, notatka: "Kolano na ławce"}
          - cwiczenie: {co: mostek_jednonoz, powt: 10, notatka: "2 s w górze"}
          - cwiczenie: {co: plank_boczny, sek: 30, notatka: "Biodra wysoko"}
          - cwiczenie: {co: dead_bug, powt: 20, notatka: "Naprzemiennie, 10 na stronę. Lędźwie przy podłodze"}
          - przerwa: {sek: 60}
  B:
    nazwa: "Siła B: jednonóż i pośladki"
    opis: >-
      15-20 min po spokojnym biegu. 2 obwody, przerwa 60 s. Wolne tempo,
      kolano nad stopą, bez bólu pachwiny i biodra.
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg, 10 przysiadów"}
      - powtorz: 2
        kroki:
          - cwiczenie: {co: przysiad_bulgarski, powt: 8, notatka: "Bez hantli. Tylna stopa na krześle"}
          - cwiczenie: {co: martwy_jednonoz, powt: 8, notatka: "Bez obciążenia. Plecy proste"}
          - cwiczenie: {co: wspiecia_jednonoz, powt: 12, notatka: "3 s w dół"}
          - cwiczenie: {co: copenhagen, sek: 20, notatka: "Kolano na ławce"}
          - cwiczenie: {co: plank, sek: 45, notatka: "Albo na przedramionach"}
          - przerwa: {sek: 60}
  A2:
    nazwa: "Siła A2: przywodziciele i core+"
    opis: >-
      Wersja trudniejsza A (tygodnie 5-7). 3 obwody, przerwa 60 s. Copenhagen
      pełny (stopa na ławce) tylko jeśli łatwa wersja była bez dyskomfortu.
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg przód-tył i w bok"}
      - powtorz: 3
        kroki:
          - cwiczenie: {co: copenhagen, sek: 25, notatka: "Stopa na ławce albo kolano, jeśli pachwina czuje"}
          - cwiczenie: {co: mostek_jednonoz, powt: 12, notatka: "3 s w górze"}
          - cwiczenie: {co: plank_boczny_noga, sek: 35}
          - cwiczenie: {co: dead_bug, powt: 24, notatka: "Naprzemiennie, 12 na stronę. Wolno, wydech przy wyproście"}
          - cwiczenie: {co: muszelka, powt: 15}
          - przerwa: {sek: 60}
  B2:
    nazwa: "Siła B2: jednonóż i pośladki+"
    opis: >-
      Wersja trudniejsza B (tygodnie 5-7). 2-3 obwody (trzeci tylko przy
      świeżych nogach), przerwa 60 s. Bez bólu pachwiny i biodra.
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg, 10 przysiadów"}
      - powtorz: 2
        kroki:
          - cwiczenie: {co: przysiad_bulgarski, powt: 10, notatka: "Bez hantli. 3 s w dół"}
          - cwiczenie: {co: martwy_jednonoz, powt: 10, notatka: "Bez obciążenia. Plecy proste"}
          - cwiczenie: {co: wykroki_boczne, powt: 8, notatka: "Płytko, bez bólu pachwiny"}
          - cwiczenie: {co: wspiecia_jednonoz, powt: 15, notatka: "3 s w dół"}
          - cwiczenie: {co: copenhagen, sek: 25}
          - cwiczenie: {co: plank, sek: 60, notatka: "Albo na przedramionach"}
          - przerwa: {sek: 60}
      - cwiczenie: {co: plank, lap: true, notatka: "OPCJONALNIE 3. obwód przy świeżych nogach. Inaczej zakończ trening"}
  L:
    nazwa: "Siła L: lekko"
    opis: >-
      Tydzień odciążenia i przedstartowy. 2 obwody, przerwa 45 s. Ma być
      łatwo - podtrzymanie, nie trening.
    kroki:
      - rozgrzewka: {min: 2, notatka: "Krążenia bioder, wymachy nóg"}
      - powtorz: 2
        kroki:
          - cwiczenie: {co: copenhagen, sek: 15, notatka: "Kolano na ławce"}
          - cwiczenie: {co: mostek, powt: 12, notatka: "Obunóż, 2 s w górze"}
          - cwiczenie: {co: plank_boczny, sek: 20}
          - cwiczenie: {co: dead_bug, powt: 16, notatka: "Naprzemiennie, 8 na stronę"}
          - przerwa: {sek: 45}
  C:
    nazwa: "Core + góra 10 min"
    opis: >-
      Opcjonalnie, w dzień wolny albo po rozruchu. 2 obwody bez przerw między
      ćwiczeniami, 45 s po obwodzie. Pomiń przy zmęczeniu przed długim biegiem.
    kroki:
      - powtorz: 2
        kroki:
          - cwiczenie: {co: plank, sek: 40, notatka: "Albo na przedramionach"}
          - cwiczenie: {co: pompki, powt: 10, notatka: "Na kolanach, jeśli technika się psuje"}
          - cwiczenie: {co: bird_dog, powt: 20, notatka: "Naprzemiennie, 10 na stronę. 2 s w wyproście"}
          - cwiczenie: {co: plank_boczny, sek: 25}
          - cwiczenie: {co: superman, powt: 12}
          - cwiczenie: {co: hollow, sek: 20, notatka: "Hollow hold. Łatwiej: kolana ugięte"}
          - przerwa: {sek: 45}
  A3:
    nazwa: "Siła A3: przywodziciele i core++"
    opis: >-
      Blok 2, tygodnie 2-4 i 6-7. 3 obwody, przerwa 60 s. Copenhagen ze stopą
      na ławce tylko bez dyskomfortu w pachwinie, inaczej kolano. Muszelka z gumą.
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg przód-tył i w bok"}
      - powtorz: 3
        kroki:
          - cwiczenie: {co: copenhagen, sek: 30, notatka: "Stopa na ławce albo kolano, jeśli pachwina czuje"}
          - cwiczenie: {co: mostek_jednonoz, powt: 12, notatka: "3 s w górze"}
          - cwiczenie: {co: plank_boczny_noga, sek: 40}
          - cwiczenie: {co: dead_bug, powt: 24, notatka: "Naprzemiennie, 12 na stronę. Wolno, wydech przy wyproście"}
          - cwiczenie: {co: muszelka, powt: 20, notatka: "Guma nad kolanami"}
          - przerwa: {sek: 60}
  B3:
    nazwa: "Siła B3: jednonóż z obciążeniem"
    opis: >-
      Blok 2, tygodnie 2-4 i 6-7. 3 obwody, przerwa 90 s. Hantle albo plecak
      z obciążeniem 2 x 6-10 kg; ciężar taki, żeby ostatnie 2 powtórzenia były
      trudne, ale technicznie czyste. Bez bólu pachwiny i biodra.
    kroki:
      - rozgrzewka: {min: 3, notatka: "Krążenia bioder, wymachy nóg, 10 przysiadów"}
      - powtorz: 3
        kroki:
          - cwiczenie: {co: przysiad_bulgarski, powt: 8, notatka: "Z hantlami. 3 s w dół"}
          - cwiczenie: {co: martwy_jednonoz, powt: 8, notatka: "Hantel w przeciwnej ręce. Plecy proste"}
          - cwiczenie: {co: wejscia_na_podwyzszenie, powt: 10, notatka: "Stopień do wysokości kolana, bez odbijania się drugą nogą"}
          - cwiczenie: {co: wspiecia_jednonoz, powt: 15, notatka: "Z hantlem. 3 s w dół"}
          - cwiczenie: {co: plank, sek: 60, notatka: "Albo na przedramionach"}
          - przerwa: {sek: 90}

treningi:
  # --- Tydzień 1/8 ---
  - {data: 2026-10-26, szablon: spokojny, km_txt: "7-8", km: 7, opcja: 1}
  - {data: 2026-10-26, sila: A}
  - data: 2026-10-27
    nazwa: "T1 Próg 3x2000"
    opis: "Wytrzymałość tempowa, tempo bliskie 10 km. Nie szybciej niż 4:10; druga seria wolniejsza niż 4:16 - kończysz. Zapisz średnie HR z 2. połowy każdej serii (weryfikacja LTHR 167)."
    dopisz_stop: true
    kroki:
      - rozgrzewka_std:
      - powtorz: 3
        kroki:
          - bieg: {m: 2000, tempo: ["4:11", "4:14"]}
          - odpoczynek: {min: 2}
      - schlodzenie_std:
  - {data: 2026-10-28, szablon: opcja_rozruch}
  - {data: 2026-10-29, szablon: spokojny, km_txt: "8-9", km: 8, opcja: 1}
  - {data: 2026-10-29, sila: B}
  - data: 2026-10-30
    nazwa: "T1 VO2 5-6x1000"
    opis: "Utrzymanie szybkości i VO2max. Zmniejsz/przerwij: 4. powtórzenie wolniejsze niż 3:58 - kończysz na 4. OPCJONALNIE 6. powtórzenie: tylko jeśli wtorek RPE <=17 i HRV w normie. Inaczej pomiń krok."
    dopisz_stop: true
    kroki:
      - rozgrzewka_std:
      - powtorz: 5
        kroki:
          - bieg: {m: 1000, tempo: ["3:52", "3:56"]}
          - odpoczynek: {min: 2, sek: 45}
      - odpoczynek: {min: 2, sek: 45}
      - bieg: {m: 1000, tempo: ["3:52", "3:56"], notatka: "OPCJONALNIE dodatkowe powtórzenie. Inaczej pomiń krok."}
      - schlodzenie_std:
  - {data: 2026-10-31, szablon: opcja_rozruch}
  - {data: 2026-10-31, sila: C, opcjonalny: true}
  - {data: 2026-11-01, szablon: dlugi, km_txt: "18-20", km: 18, opcja: 2, uwaga: "Cały w 5:20-5:35, bez przyspieszeń na końcu."}

  # --- Tydzień 2/8 ---
  - {data: 2026-11-02, szablon: spokojny, km_txt: "7-8", km: 7, opcja: 1}
  - {data: 2026-11-02, sila: A}
  - data: 2026-11-03
    nazwa: "T2 Próg 2x3000"
    opis: "Wytrzymałość tempowa - dłuższe odcinki."
    dopisz_stop: true
    kroki:
      - rozgrzewka_std:
      - powtorz: 2
        kroki:
          - bieg: {m: 3000, tempo: ["4:11", "4:14"]}
          - odpoczynek: {min: 2, sek: 30}
      - schlodzenie_std:
  - {data: 2026-11-04, szablon: opcja_rozruch}
  - {data: 2026-11-05, szablon: spokojny, km_txt: "8-9", km: 8, opcja: 1}
  - {data: 2026-11-05, sila: B}
  - data: 2026-11-06
    nazwa: "T2 VO2 5x1200"
    opis: "VO2max i ekonomia biegu."
    dopisz_stop: true
    kroki:
      - rozgrzewka_std:
      - powtorz: 5
        kroki:
          - bieg: {m: 1200, tempo: ["3:55", "3:58"]}
          - odpoczynek: {min: 2, sek: 45}
      - schlodzenie_std:
  - {data: 2026-11-07, szablon: opcja_rozruch}
  - {data: 2026-11-07, sila: C, opcjonalny: true}
  - {data: 2026-11-08, szablon: dlugi, km_txt: "18", km: 18}

  # --- Tydzień 3/8 ---
  - {data: 2026-11-09, szablon: spokojny, km_txt: "7-8", km: 7, opcja: 1}
  - {data: 2026-11-09, sila: A}
  - data: 2026-11-10
    nazwa: "T3 Próg 4x2000"
    opis: "Wytrzymałość tempowa - największa objętość progu w bloku (8 km). 4x1600 w ok. 4:12 dało RPE 17, więc nie szybciej niż 4:12. Po 3. serii RPE >17 - kończysz na 3."
    dopisz_stop: true
    kroki:
      - rozgrzewka_std:
      - powtorz: 4
        kroki:
          - bieg: {m: 2000, tempo: ["4:12", "4:15"]}
          - odpoczynek: {min: 1, sek: 45}
      - schlodzenie_std:
  - {data: 2026-11-11, szablon: opcja_rozruch}
  - {data: 2026-11-12, szablon: spokojny, km_txt: "8-9", km: 8, opcja: 1}
  - {data: 2026-11-12, sila: B}
  - data: 2026-11-13
    nazwa: "T3 Szybkość 8x400"
    opis: "Szybkość i ekonomia, krótkie odcinki. Ok. 1:30-1:32 na odcinek."
    dopisz_stop: true
    kroki:
      - rozgrzewka_std:
      - powtorz: 8
        kroki:
          - bieg: {m: 400, tempo: ["3:45", "3:50"]}
          - odpoczynek: {m: 200}
      - schlodzenie_std:
  - {data: 2026-11-14, szablon: opcja_rozruch}
  - {data: 2026-11-14, sila: C, opcjonalny: true}
  - {data: 2026-11-15, szablon: dlugi, km_txt: "18", km: 18}

  # --- Tydzień 4/8 (odciążenie + test) ---
  - {data: 2026-11-16, szablon: spokojny, km_txt: "6-7", km: 6, opcja: 1}
  - {data: 2026-11-16, sila: L}
  - data: 2026-11-17
    nazwa: "T4 Próg 4x1000 lekko"
    opis: "Utrzymanie progu w tygodniu odciążenia, 3 dni przed testem. Kontrolowane, RPE <=15; jeśli wyżej - zwolnij, nie walcz o tempo."
    dopisz_stop: true
    kroki:
      - rozgrzewka_std:
      - powtorz: 4
        kroki:
          - bieg: {m: 1000, tempo: ["4:12", "4:15"]}
          - odpoczynek: {sek: 90}
      - schlodzenie_std:
  - {data: 2026-11-18, szablon: opcja_rozruch}
  - {data: 2026-11-19, szablon: spokojny, km_txt: "6", km: 6, przebiezki: true}
  - data: 2026-11-20
    nazwa: T4 TEST 5 km
    opis: >-
      Test formy - porównanie z 19:44 z 13.10. Rozgrzewka 3 km + 4x100 m
      + 5 min przerwy. 5 km maksymalnie równo: start 3:56-3:58/km (pierwsze
      2 km nie szybciej niż 3:56), od 3 km utrzymaj, ostatnie 1000 m dociśnij.
      Wynik: <=19:15 sub-40 realne; 19:15-19:40 cel 40:30-40:50; >19:40
      sub-40 na wiosnę. Przy wietrze/lodzie, złym samopoczuciu lub niskim HRV
      przełóż o dzień.
    dopisz_stop: true
    kroki: test_5km
  - {data: 2026-11-21, szablon: opcja_rozruch}
  - {data: 2026-11-21, sila: C, opcjonalny: true}
  - {data: 2026-11-22, szablon: dlugi, km_txt: "14-16", km: 14, opcja: 2, uwaga: Tydzień odciążenia - spokojnie.}

  # --- Tydzień 5/8 ---
  - {data: 2026-11-23, szablon: spokojny, km_txt: "7-8", km: 7, opcja: 1}
  - {data: 2026-11-23, sila: A2}
  - data: 2026-11-24
    nazwa: "T5 Próg 2x4000"
    opis: "Wytrzymałość tempowa, długie odcinki. Tempo skoryguj po teście (próg ok. 6-7% wolniej niż 5 km); bez nowych danych nie szybciej niż 4:12."
    dopisz_stop: true
    kroki:
      - rozgrzewka_std:
      - powtorz: 2
        kroki:
          - bieg: {m: 4000, tempo: ["4:12", "4:15"]}
          - odpoczynek: {min: 2, sek: 30}
      - schlodzenie_std:
  - {data: 2026-11-25, szablon: opcja_rozruch}
  - {data: 2026-11-26, szablon: spokojny, km_txt: "8-9", km: 8, opcja: 1}
  - {data: 2026-11-26, sila: B2}
  - data: 2026-11-27
    nazwa: "T5 VO2 5x1000"
    opis: "VO2max. Tempo = 5 km z testu minus 2-3 s/km."
    dopisz_stop: true
    kroki:
      - rozgrzewka_std:
      - powtorz: 5
        kroki:
          - bieg: {m: 1000, tempo: ["3:52", "3:55"]}
          - odpoczynek: {min: 2, sek: 45}
      - schlodzenie_std:
