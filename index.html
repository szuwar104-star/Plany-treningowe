<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E8C">
<title>Plan → Garmin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF2F6; --surface: #FFFFFF; --ink: #14243A; --muted: #5B6B80;
  --line: #D5DDE7; --track: #1F4E8C; --on-track: #FFFFFF; --signal: #F2C230;
  --on-signal: #14243A; --easy: #C9DAF1; --red: #C33A3A; --ok: #2E7D4F;
  --cond: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "Roboto Mono", Menlo, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D1726; --surface: #15233A; --ink: #E7EEF7; --muted: #93A3B8;
    --line: #263955; --track: #4F86D1; --on-track: #0D1726; --signal: #F2C230;
    --easy: #2A4569; --red: #E06666; --ok: #5DBB85;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--body);
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--track); color: var(--on-track);
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--track);
}
header h1 {
  margin: 0; flex: 1; font: 700 26px/1 var(--cond); letter-spacing: .01em;
}
header small { display: block; font: 500 14px/1.2 var(--body); opacity: .8; margin-top: 4px; }
.ikonka {
  border: 0; background: transparent; color: inherit; width: 44px; height: 44px;
  border-radius: 50%; display: grid; place-items: center; cursor: pointer;
}
.ikonka:hover { background: rgba(255,255,255,.12); }

main { max-width: 640px; margin: 0 auto; padding: 16px 16px 120px; }

.akcje { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 10px 14px; cursor: pointer; font-weight: 600;
}
.btn.glowny {
  background: var(--track); color: var(--on-track); border-color: var(--track);
}
.btn:disabled { opacity: .45; cursor: not-allowed; }

textarea {
  width: 100%; height: 140px; margin-top: 12px; padding: 12px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  font: 13px/1.5 var(--mono); resize: vertical; white-space: pre; overflow-x: auto;
}

.komunikat { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--surface);
  border-left: 4px solid var(--muted); }
.komunikat.blad { border-left-color: var(--red); }
.komunikat.ok { border-left-color: var(--ok); }
.komunikat:empty { display: none; }

/* --- podgląd planu: bieżnia tygodni --- */
#podglad { margin-top: 20px; }
#podglad[hidden] { display: none; }
.podsumowanie { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.podsumowanie strong { font: 700 34px/1 var(--cond); }
.podsumowanie span { color: var(--muted); }
.zmiany { font-weight: 600; color: var(--ink); }

.siatka { display: grid; grid-template-columns: 38px repeat(7, minmax(0, 1fr)); gap: 3px; }
.siatka .dz { font: 600 13px/1 var(--cond); color: var(--muted); text-align: center; padding-bottom: 2px; }
.siatka .tydz { font: 600 13px/1 var(--cond); color: var(--muted); align-self: center; }
.dzien {
  position: relative; border: 0; border-radius: 6px; min-height: 46px; padding: 4px 2px 3px;
  background: transparent; display: flex; flex-direction: column; align-items: center;
  justify-content: space-between; cursor: pointer; overflow: hidden;
}
.dzien .nr { font: 600 11px/1 var(--cond); opacity: .75; }
.dzien .et.dluga { font-size: 11.5px; letter-spacing: -.02em; }
.dzien .et.b-dluga { font-size: 10px; letter-spacing: -.03em; }
.dzien .et { font: 700 14px/1.05 var(--cond); text-align: center; white-space: nowrap; max-width: 100%; overflow: hidden; }
.dzien.pusty { cursor: default; background: transparent; }
.dzien.spokojny { background: var(--easy); color: var(--ink); }
.dzien.dlugi { background: var(--track); color: var(--on-track); }
.dzien.akcent { background: var(--signal); color: var(--on-signal); }
.dzien.test, .dzien.start { background: var(--red); color: #fff; }
.dzien.opcja, .dzien.inny {
  background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 7px);
  color: var(--muted); box-shadow: inset 0 0 0 1px var(--line);
}
.dzien.minelo { opacity: .35; }
.dzien.zmiana::after, .dzien.nowy::after {
  content: ""; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--surface);
}
.dzien[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 1px; }

.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--muted); font-size: 14px; }
.legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.szczegoly { margin-top: 12px; padding: 12px; background: var(--surface); border-radius: 10px; }
.szczegoly:empty { display: none; }
.szczegoly b { font: 700 20px/1.1 var(--cond); display: block; }
.szczegoly p { margin: 4px 0 0; color: var(--muted); }

/* --- wysyłka i postęp --- */
.dolny {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
}
.dolny .btn { width: 100%; max-width: 608px; display: block; margin: 0 auto; padding: 14px;
  font: 700 20px/1 var(--cond); letter-spacing: .02em; }

#postep { margin-top: 20px; }
#postep[hidden] { display: none; }
#postep ol { list-style: none; margin: 0; padding: 0; }
#postep li { display: flex; gap: 10px; align-items: center; padding: 8px 0; color: var(--muted); }
#postep li .kropka { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
#postep li.trwa { color: var(--ink); }
#postep li.trwa .kropka { border-color: var(--signal); border-top-color: transparent; animation: krec 1s linear infinite; }
#postep li.zrobione { color: var(--ink); }
#postep li.zrobione .kropka { background: var(--ok); border-color: var(--ok); }
#postep li.blad { color: var(--red); }
#postep li.blad .kropka { background: var(--red); border-color: var(--red); }
@keyframes krec { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #postep li.trwa .kropka { animation: none; } }
a { color: var(--track); }

/* --- ustawienia --- */
dialog {
  border: 0; border-radius: 14px; padding: 20px; width: min(92vw, 460px);
  background: var(--surface); color: var(--ink);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h2 { margin: 0 0 12px; font: 700 24px/1 var(--cond); }
label { display: block; font-weight: 600; margin-top: 14px; }
label span { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
dialog input {
  width: 100%; margin-top: 6px; padding: 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg);
}
.wiersz { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.wiersz .btn { flex: 1; }
#test-wynik { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; }
#test-wynik li { padding: 3px 0; }
</style>
</head>
<body>
<header>
  <h1>Plan → Garmin<small id="repo-naglowek"></small></h1>
  <button class="ikonka" id="otworz-ustawienia" aria-label="Ustawienia">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main>
  <div class="akcje">
    <button class="btn glowny" id="wklej">Wklej ze schowka</button>
    <button class="btn" id="z-repo">Wczytaj plan z repo</button>
    <button class="btn" id="wyczysc">Wyczyść</button>
  </div>
  <textarea id="tekst" spellcheck="false" autocapitalize="off" autocomplete="off"
    placeholder="Wklej tu plan.yaml (z linią treningi:)" aria-label="Treść planu"></textarea>
  <p class="komunikat" id="komunikat" role="status"></p>

  <section id="podglad" hidden aria-label="Podgląd planu">
    <div class="podsumowanie">
      <strong id="ile"></strong>
      <span id="zakres"></span>
      <span class="zmiany" id="zmiany"></span>
    </div>
    <div class="siatka" id="siatka"></div>
    <div class="legenda">
      <span><i style="background:var(--easy)"></i>spokojny</span>
      <span><i style="background:var(--signal)"></i>akcent</span>
      <span><i style="background:var(--track)"></i>długi</span>
      <span><i style="background:var(--red)"></i>test / start</span>
      <span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--muted) 3px 4px)"></i>opcjonalny</span>
      <span id="leg-zmiana" hidden><i style="background:var(--ink);border-radius:50%"></i>zmiana względem repo</span>
    </div>
    <div class="szczegoly" id="szczegoly"></div>
  </section>

  <section id="postep" hidden aria-live="polite">
    <ol>
      <li id="e1"><span class="kropka"></span><span>Wysłany do GitHuba</span></li>
      <li id="e2"><span class="kropka"></span><span>Sprawdzony i zapisany w repo</span></li>
      <li id="e3"><span class="kropka"></span><span>Treningi w Garmin Connect</span></li>
    </ol>
    <p class="komunikat" id="postep-info"></p>
  </section>
</main>

<div class="dolny">
  <button class="btn glowny" id="wyslij" disabled>Wyślij do Garmina</button>
</div>

<dialog id="ustawienia">
  <form method="dialog" id="form-ustawien">
    <h2>Ustawienia</h2>
    <label>Token GitHuba
      <span>Fine-grained, tylko repo z planem. Contents: Read and write; Actions: Read-only pokazuje postęp. Zapisany tylko na tym telefonie.</span>
      <input type="password" id="pole-token" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    </label>
    <label>Repozytorium
      <span>login/nazwa</span>
      <input type="text" id="pole-repo" autocomplete="off" spellcheck="false" autocapitalize="off">
    </label>
    <ul id="test-wynik"></ul>
    <div class="wiersz">
      <button type="button" class="btn" id="sprawdz">Sprawdź połączenie</button>
      <button type="submit" class="btn glowny" value="zapisz">Zapisz</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const DOMYSLNE_REPO = "szuwar104-star/Plany-treningowe";
const PLIK = "plan.yaml";
const DNI = ["Pn", "Wt", "Śr", "Cz", "Pt", "So", "Nd"];

// ---------- ustawienia (tylko na tym urządzeniu) ----------
function czytaj(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } }
function zapisz(k, v) { try { localStorage.setItem(k, v); } catch {} }
const ust = {
  get token() { return czytaj("pg.token").trim(); },
  get repo() { return czytaj("pg.repo", DOMYSLNE_REPO).trim() || DOMYSLNE_REPO; },
};

function gh(sciezka, opcje = {}) {
  return fetch("https://api.github.com/repos/" + ust.repo + sciezka, {
    cache: "no-store",
    ...opcje,
    headers: {
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(ust.token ? { "Authorization": "Bearer " + ust.token } : {}),
      ...(opcje.headers || {}),
    },
  });
}

function opisBledu(status) {
  if (status === 401) return "GitHub odrzucił token. Wklej go ponownie w ustawieniach (ikona koła zębatego).";
  if (status === 403) return "Token nie ma uprawnienia Contents: Read and write do tego repo.";
  if (status === 404) return "Nie widzę repozytorium " + ust.repo + ". Sprawdź nazwę w ustawieniach i czy token ma do niego dostęp.";
  return "GitHub odpowiedział kodem " + status + ".";
}

// ---------- odczyt planu (lekki, tylko do podglądu; pełną kontrolę robi GitHub) ----------
function pole(tekst, klucz) {
  const m = tekst.match(new RegExp("(?:^|[{,\\s-])" + klucz + ":\\s*(\"([^\"]*)\"|'([^']*)'|([^,}\\n#]+))"));
  if (!m) return null;
  return (m[2] ?? m[3] ?? m[4] ?? "").trim();
}

// "T1 Próg 3x2000" -> "3×2k", "T3 Szybkość 8x400" -> "8×400"
function krotkaSeria(nazwa) {
  const m = nazwa.match(/(\d+(?:-\d+)?)\s*x\s*(\d+)/i);
  if (!m) return nazwa.replace(/^T\d+\s+/, "").split(/\s+/)[0].slice(0, 6);
  const metry = +m[2];
  const odc = metry >= 1000 ? (metry / 1000).toString().replace(".", ",") + "k" : String(metry);
  return m[1] + "×" + odc;
}

function rozbierz(tekst) {
  const wynik = { pozycje: [], bledy: [] };
  if (!tekst.trim()) return wynik;
  if (/\t/.test(tekst)) wynik.bledy.push("Plik zawiera tabulatory – YAML ich nie przyjmie. Użyj spacji.");
  const linie = tekst.replace(/\r/g, "").split("\n");
  const start = linie.findIndex(l => /^treningi:\s*(#.*)?$/.test(l));
  if (start < 0) { wynik.bledy.push("Brak linii treningi: – to nie wygląda na cały plan."); return wynik; }

  let wciecie = null, biezaca = null;
  const bloki = [];
  for (const l of linie.slice(start + 1)) {
    if (!l.trim() || l.trim().startsWith("#")) continue;
    const w = l.length - l.trimStart().length;
    if (w === 0) break;                       // koniec sekcji treningi
    if (l.trimStart().startsWith("- ") && (wciecie === null || w === wciecie)) {
      wciecie = w; biezaca = [l]; bloki.push(biezaca);
    } else if (biezaca) biezaca.push(l);
  }

  for (const b of bloki) {
    const surowe = b.join("\n");
    const data = (surowe.match(/(?:^|[{,\s-])data:\s*["']?(\d{4}-\d{2}-\d{2})/) || [])[1];
    if (!data) { wynik.bledy.push("Pozycja bez daty: " + b[0].trim().slice(0, 50)); continue; }
    const szablon = pole(surowe, "szablon");
    const nazwa = pole(surowe, "nazwa") || "";
    const km = pole(surowe, "km_txt") || "";
    const opc = /opcjonalny:\s*true/.test(surowe);
    let rodzaj, etykieta, pelna;
    if (szablon === "spokojny") {
      rodzaj = "spokojny"; etykieta = km; pelna = "Spokojny " + km + " km" + (/przebiezki:\s*true/.test(surowe) ? " + przebieżki" : "");
    } else if (szablon === "dlugi") {
      rodzaj = "dlugi"; etykieta = km; pelna = "Długi " + km + " km";
    } else if (szablon === "opcja_rozruch") {
      rodzaj = "opcja"; etykieta = "opc."; pelna = "Opcja: wolne lub 5-6 km";
    } else if (szablon === "akcent") {
      rodzaj = "akcent"; pelna = nazwa;
      etykieta = krotkaSeria(nazwa);
    } else {
      pelna = nazwa || "(bez nazwy)";
      rodzaj = /start/i.test(nazwa) ? "start" : /test/i.test(nazwa) ? "test" : opc ? "opcja" : "inny";
      etykieta = rodzaj === "start" ? "START" : rodzaj === "test" ? "TEST" : rodzaj === "opcja" ? "opc."
        : (nazwa.match(/\d+(?:-\d+)?/) || [nazwa.slice(0, 5)])[0];
    }
    if (szablon && !["spokojny", "dlugi", "opcja_rozruch", "akcent"].includes(szablon))
      wynik.bledy.push(data + ": nieznany szablon „" + szablon + "”.");
    wynik.pozycje.push({ data, rodzaj, etykieta, pelna, opcjonalny: opc || rodzaj === "opcja",
                         klucz: surowe.replace(/\s+/g, " ").trim() });
  }
  if (!wynik.pozycje.length && !wynik.bledy.length) wynik.bledy.push("Sekcja treningi jest pusta.");
  return wynik;
}

// ---------- daty ----------
const dzisiaj = (() => { const d = new Date(); return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); })();
const naDate = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
const krotko = d => String(d.getUTCDate()).padStart(2, "0") + "." + String(d.getUTCMonth() + 1).padStart(2, "0");

// ---------- stan ----------
let plan = { pozycje: [], bledy: [] };
let bazowy = null;            // Map data -> klucz (plan w repo), do zaznaczania zmian
let wybrany = null;

function odswiez() {
  const tekst = $("#tekst").value;
  plan = rozbierz(tekst);
  const kom = $("#komunikat");
  kom.className = "komunikat";
  if (!tekst.trim()) kom.textContent = "";
  else if (plan.bledy.length) { kom.className = "komunikat blad"; kom.textContent = plan.bledy.join(" "); }
  else kom.textContent = "";
  rysuj();
  $("#wyslij").disabled = !(plan.pozycje.length && !plan.bledy.length);
  try { sessionStorage.setItem("pg.szkic", tekst); } catch {}
}

function rysuj() {
  const sek = $("#podglad");
  if (!plan.pozycje.length) { sek.hidden = true; return; }
  sek.hidden = false;
  const poz = [...plan.pozycje].sort((a, b) => a.data.localeCompare(b.data));
  const pierwsza = naDate(poz[0].data), ostatnia = naDate(poz[poz.length - 1].data);
  const przyszle = poz.filter(p => naDate(p.data) >= dzisiaj).length;

  $("#ile").textContent = poz.length + (poz.length === 1 ? " trening" : poz.length % 10 >= 2 && poz.length % 10 <= 4 && (poz.length % 100 < 10 || poz.length % 100 >= 20) ? " treningi" : " treningów");
  $("#zakres").textContent = krotko(pierwsza) + "–" + krotko(ostatnia) +
    (przyszle < poz.length ? ", do wysłania " + przyszle + " (minione są pomijane)" : "");

  // porównanie z planem w repo
  const status = new Map();
  let nowe = 0, zmienione = 0, usuniete = 0;
  if (bazowy) {
    for (const p of poz) {
      if (!bazowy.has(p.data)) { status.set(p.data, "nowy"); nowe++; }
      else if (bazowy.get(p.data) !== p.klucz) { status.set(p.data, "zmiana"); zmienione++; }
    }
    const daty = new Set(poz.map(p => p.data));
    for (const d of bazowy.keys())
      if (!daty.has(d) && naDate(d) >= pierwsza && naDate(d) <= ostatnia) usuniete++;
  }
  const opisZm = [];
  if (zmienione) opisZm.push("zmienione: " + zmienione);
  if (nowe) opisZm.push("nowe: " + nowe);
  if (usuniete) opisZm.push("usunięte: " + usuniete);
  $("#zmiany").textContent = !bazowy ? "" : opisZm.length ? opisZm.join(", ") : "bez zmian względem repo";
  $("#leg-zmiana").hidden = !(zmienione || nowe);

  // siatka tygodni (od poniedziałku)
  const s = $("#siatka");
  s.innerHTML = "";
  s.append(el("div", "dz", ""));
  DNI.forEach(d => s.append(el("div", "dz", d)));
  const wgDaty = new Map(poz.map(p => [p.data, p]));
  const od = new Date(pierwsza); od.setUTCDate(od.getUTCDate() - ((od.getUTCDay() + 6) % 7));
  for (let t = new Date(od); t <= ostatnia; t.setUTCDate(t.getUTCDate() + 7)) {
    s.append(el("div", "tydz", krotko(t)));
    for (let i = 0; i < 7; i++) {
      const d = new Date(t); d.setUTCDate(d.getUTCDate() + i);
      const p = wgDaty.get(iso(d));
      const b = document.createElement("button");
      b.type = "button";
      if (!p) { b.className = "dzien pusty"; b.tabIndex = -1; b.setAttribute("aria-hidden", "true"); s.append(b); continue; }
      b.className = "dzien " + p.rodzaj + (d < dzisiaj ? " minelo" : "") + (status.get(p.data) ? " " + status.get(p.data) : "");
      b.setAttribute("aria-pressed", String(wybrany === p.data));
      b.setAttribute("aria-label", p.data + ": " + p.pelna);
      b.append(el("span", "nr", String(d.getUTCDate())), el("span", "et" + (p.etykieta.length > 5 ? " b-dluga" : p.etykieta.length > 4 ? " dluga" : ""), p.etykieta));
      b.addEventListener("click", () => { wybrany = wybrany === p.data ? null : p.data; rysuj(); });
      s.append(b);
    }
  }

  const sz = $("#szczegoly");
  sz.innerHTML = "";
  const p = wybrany && wgDaty.get(wybrany);
  if (p) {
    const d = naDate(p.data);
    sz.append(el("b", "", p.pelna));
    const info = [DNI[(d.getUTCDay() + 6) % 7] + " " + krotko(d)];
    if (p.opcjonalny) info.push("opcjonalny");
    if (d < dzisiaj) info.push("data minęła – nie zostanie wysłany");
    if (status.get(p.data) === "zmiana") info.push("inny niż w repo");
    if (status.get(p.data) === "nowy") info.push("nowy dzień");
    sz.append(el("p", "", info.join(", ")));
  }
}

// usuwa znaczniki bloku kodu (```yaml) i tekst przed planem, gdy skopiowano całą odpowiedź
function oczysc(t) {
  const linie = t.replace(/\r/g, "").split("\n").filter(l => !/^\s*```/.test(l));
  const i = linie.findIndex(l => /^(#|stare_nazwy:|treningi:)/.test(l));
  return (i > 0 ? linie.slice(i) : linie).join("\n").replace(/\s+$/, "") + "\n";
}

function el(tag, klasa, tekst) {
  const e = document.createElement(tag);
  if (klasa) e.className = klasa;
  e.textContent = tekst;
  return e;
}

function komunikat(tekst, typ = "") {
  const k = $("#komunikat"); k.className = "komunikat " + typ; k.textContent = tekst;
}

// ---------- plan z repo ----------
async function pobierzZRepo() {
  const r = await gh("/contents/" + PLIK + "?ref=main", { headers: { "Accept": "application/vnd.github.raw" } });
  if (r.status === 404 && ust.token) return null;
  if (!r.ok) throw new Error(opisBledu(r.status));
  return await r.text();
}

async function wczytajBazowy() {
  if (!ust.token) return;
  try {
    const t = await pobierzZRepo();
    bazowy = new Map((t ? rozbierz(t).pozycje : []).map(p => [p.data, p.klucz]));
    rysuj();
  } catch { /* brak porównania nie blokuje wysyłki */ }
}

// ---------- wysyłka ----------
function base64Utf8(tekst) {
  const bajty = new TextEncoder().encode(tekst);
  let s = "";
  for (let i = 0; i < bajty.length; i += 0x8000) s += String.fromCharCode(...bajty.subarray(i, i + 0x8000));
  return btoa(s);
}

function etap(nr, stan) {
  const li = $("#e" + nr);
  li.className = stan || "";
}

async function wyslij() {
  if (!ust.token) { otworzUstawienia("Najpierw wklej token GitHuba."); return; }
  const tekst = $("#tekst").value;
  $("#wyslij").disabled = true;
  $("#postep").hidden = false;
  [1, 2, 3].forEach(n => etap(n, ""));
  etap(1, "trwa");
  info("");
  const wyslano = Date.now();
  let r;
  try {
    r = await gh("/dispatches", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ event_type: "nowy-plan", client_payload: { plan_b64: base64Utf8(tekst) } }),
    });
  } catch {
    etap(1, "blad"); info("Brak połączenia z GitHubem. Sprawdź internet i spróbuj ponownie.", "blad");
    $("#wyslij").disabled = false; return;
  }
  if (r.status !== 204) {
    etap(1, "blad"); info(opisBledu(r.status), "blad");
    $("#wyslij").disabled = false; return;
  }
  etap(1, "zrobione");
  etap(2, "trwa");
  await sledz(wyslano, tekst);
  $("#wyslij").disabled = !(plan.pozycje.length && !plan.bledy.length);
}

function info(tekst, typ = "", link) {
  const p = $("#postep-info");
  p.className = "komunikat " + typ;
  p.textContent = tekst;
  if (link) {
    p.append(" ");
    const a = document.createElement("a");
    a.href = link; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Otwórz log";
    p.append(a);
  }
}

const czekaj = ms => new Promise(r => setTimeout(r, window.PG_TEST ? 50 : ms));

async function sledz(wyslano, tekst) {
  const actions = "https://github.com/" + ust.repo + "/actions";
  let run = null;
  for (let proba = 0; proba < 60; proba++) {          // ok. 4 minuty
    await czekaj(4000);
    let r;
    try { r = await gh("/actions/runs?event=repository_dispatch&per_page=5"); } catch { continue; }
    if (r.status === 403 || r.status === 404) {
      etap(2, ""); etap(3, "");
      info("Plan wysłany. Postęp zobaczysz w Actions – albo dodaj do tokenu uprawnienie Actions: Read-only, a pokażę go tutaj.", "ok", actions);
      return;
    }
    if (!r.ok) continue;
    const dane = await r.json();
    run = (dane.workflow_runs || []).find(w => Date.parse(w.created_at) >= wyslano - 60000) || run;
    if (!run) continue;

    let kroki = [];
    try {
      const j = await gh("/actions/runs/" + run.id + "/jobs");
      if (j.ok) kroki = ((await j.json()).jobs || []).flatMap(x => x.steps || []);
    } catch {}
    const krok = n => kroki.find(k => k.name.startsWith(n));
    const zapis = krok("Zapis planu"), sync = krok("Synchronizacja");

    if (zapis && zapis.conclusion === "success") etap(2, "zrobione");
    if (zapis && zapis.conclusion === "failure") {
      etap(2, "blad"); etap(3, "");
      info("GitHub odrzucił plan – jest w nim błąd (numer pozycji w logu). Nic nie zostało zmienione.", "blad", run.html_url);
      return;
    }
    if (sync && sync.status === "in_progress") etap(3, "trwa");

    const odswiezony = await gh("/actions/runs/" + run.id).then(x => x.ok ? x.json() : run).catch(() => run);
    if (odswiezony.status === "completed") {
      if (odswiezony.conclusion === "success") {
        etap(2, "zrobione"); etap(3, "zrobione");
        info("Gotowe. Zsynchronizuj zegarek, żeby zobaczyć zmiany.", "ok", run.html_url);
        bazowy = new Map(rozbierz(tekst).pozycje.map(p => [p.data, p.klucz]));
        rysuj();
      } else {
        if (!zapis || zapis.conclusion !== "success") etap(2, "blad"); else etap(3, "blad");
        info(sync && sync.conclusion === "failure"
          ? "Plan jest w repo, ale Garmin nie przyjął zmian. Najczęściej to wygasłe tokeny – szczegóły w logu."
          : "Synchronizacja zakończyła się błędem.", "blad", run.html_url);
      }
      return;
    }
  }
  info("GitHub jeszcze pracuje. Sprawdź wynik w Actions.", "", actions);
}

// ---------- ustawienia ----------
function otworzUstawienia(powod) {
  $("#pole-token").value = ust.token;
  $("#pole-repo").value = ust.repo;
  $("#test-wynik").innerHTML = "";
  if (powod) $("#test-wynik").append(el("li", "", powod));
  $("#ustawienia").showModal();
}

async function sprawdzPolaczenie() {
  zapisz("pg.token", $("#pole-token").value.trim());
  zapisz("pg.repo", $("#pole-repo").value.trim() || DOMYSLNE_REPO);
  const lista = $("#test-wynik");
  lista.innerHTML = "";
  const wiersz = t => lista.append(el("li", "", t));
  if (!ust.token) { wiersz("✗ Brak tokenu."); return; }
  try {
    const r = await gh("");
    if (!r.ok) { wiersz("✗ " + opisBledu(r.status)); return; }
    const repo = await r.json();
    wiersz("✓ Repozytorium " + repo.full_name + (repo.private ? " (prywatne)" : " (publiczne)"));
    const p = await gh("/contents/" + PLIK + "?ref=main");
    wiersz(p.ok ? "✓ plan.yaml jest w repo" : p.status === 404 ? "• plan.yaml jeszcze nie istnieje – powstanie przy pierwszej wysyłce" : "✗ Nie mogę odczytać plan.yaml (" + p.status + ")");
    const a = await gh("/actions/runs?per_page=1");
    wiersz(a.ok ? "✓ Postęp synchronizacji będzie widoczny" : "• Bez uprawnienia Actions: Read-only – postęp sprawdzisz w Actions");
    wczytajBazowy();
  } catch {
    wiersz("✗ Brak połączenia z GitHubem.");
  }
}

// ---------- zdarzenia ----------
$("#tekst").addEventListener("input", odswiez);

$("#wklej").addEventListener("click", async () => {
  try {
    const t = await navigator.clipboard.readText();
    if (!t.trim()) { komunikat("Schowek jest pusty. Skopiuj plan i spróbuj ponownie.", "blad"); return; }
    $("#tekst").value = oczysc(t); wybrany = null; odswiez();
    if (!plan.bledy.length) komunikat("Wklejono. Sprawdź podgląd i wyślij.", "ok");
  } catch {
    $("#tekst").focus();
    komunikat("Przeglądarka nie dała dostępu do schowka. Przytrzymaj pole tekstowe i wybierz Wklej.", "blad");
  }
});

$("#z-repo").addEventListener("click", async () => {
  if (!ust.token) { otworzUstawienia("Najpierw wklej token GitHuba."); return; }
  try {
    const t = await pobierzZRepo();
    if (t === null) { komunikat("W repo nie ma jeszcze pliku plan.yaml.", "blad"); return; }
    $("#tekst").value = t; wybrany = null;
    bazowy = new Map(rozbierz(t).pozycje.map(p => [p.data, p.klucz]));
    odswiez();
    komunikat("Wczytano plan z repo. Możesz go poprawić i wysłać.", "ok");
  } catch (e) { komunikat(e.message, "blad"); }
});

$("#wyczysc").addEventListener("click", () => {
  $("#tekst").value = ""; wybrany = null; $("#postep").hidden = true; odswiez();
});

$("#wyslij").addEventListener("click", wyslij);
$("#otworz-ustawienia").addEventListener("click", () => otworzUstawienia());
$("#sprawdz").addEventListener("click", sprawdzPolaczenie);
$("#form-ustawien").addEventListener("submit", () => {
  zapisz("pg.token", $("#pole-token").value.trim());
  zapisz("pg.repo", $("#pole-repo").value.trim() || DOMYSLNE_REPO);
  $("#repo-naglowek").textContent = ust.repo;
  wczytajBazowy();
});

// ---------- start ----------
$("#repo-naglowek").textContent = ust.repo;
(() => {
  // tekst udostępniony z innej aplikacji (np. z Claude) przez „Udostępnij”
  const u = new URL(location.href);
  const udostepniony = [u.searchParams.get("text"), u.searchParams.get("title")].filter(Boolean).join("\n");
  if (udostepniony.includes("treningi:")) {
    $("#tekst").value = oczysc(udostepniony);
    history.replaceState(null, "", location.pathname);
  } else {
    try { $("#tekst").value = sessionStorage.getItem("pg.szkic") || ""; } catch {}
  }
  odswiez();
  wczytajBazowy();
  if (!ust.token) otworzUstawienia("Wklej token GitHuba, żeby zacząć.");
})();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
